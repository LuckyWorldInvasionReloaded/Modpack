
#Lucky XP HUD layout, in GUI pixels.
#Forge caches these values and only re-reads them when its file watcher sees the write, which
#many editors dodge by saving to a temp file and renaming. Leaving and re-entering the world does
#NOT re-read a client config either: restart the game to be sure an edit applied.
[hud]
	#Blue Lucky XP bar height above the bottom of the screen. Must clear the vanilla level number,
	#which vanilla draws at 35.
	#Range: 0 ~ 256
	luckyXpBarY = 42
	#Vertical nudge of the BLUE level number relative to its bar (negative = up). It is centered
	#horizontally, like vanilla's own number.
	#Range: -200 ~ 200
	luckyNumberDy = -6
	#Cluster lift when the blue Lucky XP bar is shown (room opened for the blue bar and its number).
	#Range: 0 ~ 100
	reserve = 13
	#Cluster lift when the Lucky XP bar is hidden -- creative and spectator, where vanilla
	#hides its own XP bar too.
	#Range: 0 ~ 100
	gap = 2
